[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "udockerd"
version = "0.1.0"
description = "Docker Engine API-compatible daemon backed by udocker"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
dependencies = [
    # Pinned exact: udockerd reaches into udocker's internal classes
    # (LocalRepo, DockerIoAPI, ContainerStructure, engines), not just its
    # CLI, so an unpinned upgrade could silently break us.
    "udocker==1.3.17",
]

[project.scripts]
udockerd = "udockerd.__main__:main"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "docker>=7",
    "mypy>=1.19",
    "ruff>=0.15",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
udockerd = ["data/supervisor.c", "data/bin/supervisor-*"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "A", "SIM", "TCH", "PLC0415"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["udockerd"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["udocker", "udocker.*"]
ignore_missing_imports = true
