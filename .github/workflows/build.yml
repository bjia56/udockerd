name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

jobs:
  build_wheel:
    name: Build wheel
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12'

      - name: Build wheel and sdist
        run: |
          pip install --upgrade build
          python -m build

      - name: Upload wheel artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wheels
          path: dist/*

  build_multiplatform:
    name: Build multiplatform
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Get Cosmopolitan Python
        run: |
          wget https://github.com/bjia56/portable-python/releases/download/cpython-v3.13.10-beta.1/python-3.13.10t-cosmo-unknown.zip -O python-cosmo.zip
          unzip -p python-cosmo.zip "python-3.13.10t-cosmo-unknown/bin/python.standalone.com" > python.exe
          chmod +x python.exe

          # This build's site-packages path is versioned (lib/python3.13t/site-packages),
          # unlike cosmo.zip's Lib/site-packages, so derive it instead of hardcoding.
          site_packages=$(./python.exe -c "import sysconfig; print(sysconfig.get_path('purelib').removeprefix('/zip/'))")
          echo "PY_SITE_PACKAGES=$site_packages" >> "$GITHUB_ENV"

      - name: Set up zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.14.0

      - name: Build supervisor binaries
        run: |
          # Static binaries for the process supervisor (see supervisor.py),
          # so udockerd doesn't need a C compiler on the target machine.
          mkdir -p src/udockerd/data/bin
          for arch in x86_64 aarch64; do
            zig cc -target "$arch-linux-musl" -O2 -static -s \
              -o src/udockerd/data/bin/supervisor-$arch \
              src/udockerd/data/supervisor.c
          done

      - name: Bundle setuptools
        run: |
          cp ./python.exe ./python_with_setuptools.exe

          mkdir setuptools_temp
          ./python.exe -m pip install --target=setuptools_temp setuptools

          folders=$(ls setuptools_temp)
          for folder in $folders; do
            ./python.exe scripts/add_to_zip.py ./setuptools_temp/"$folder" ./python_with_setuptools.exe "$PY_SITE_PACKAGES/$folder"
          done

          rm -rf setuptools_temp

      - name: Install and bundle dependencies
        run: |
          # udocker (pulled in normally below) and udockerd are both pure
          # Python, which is what makes bundling into cosmo Python
          # possible; proot/fakechroot/curl stay external runtime binaries.
          ./python_with_setuptools.exe -m pip wheel --no-deps .

          mkdir udockerd_temp
          ./python_with_setuptools.exe -m pip install --target=udockerd_temp ./udockerd-*.whl

          folders=$(ls udockerd_temp)
          for folder in $folders; do
            ./python_with_setuptools.exe scripts/add_to_zip.py ./udockerd_temp/"$folder" ./python.exe "$PY_SITE_PACKAGES/$folder"
          done

          zip -urj python.exe scripts/.args

      - name: Rename
        run: mv python.exe udockerd.exe

      - name: Install upx
        run: |
          sudo apt update
          sudo apt install -y upx-ucl

      - name: Download blink
        run: |
          # x86_64/aarch64 run natively via ape-*.elf below; blink covers
          # the less-common Linux-only architectures (proot has no BSD/etc target).
          mkdir -p /tmp/blink
          cd /tmp/blink

          for item in \
            "blink-tiny-linux-powerpc64le-stripped blink-linux-powerpc64le" \
            "blink-tiny-linux-i386-stripped blink-linux-i386" \
            "blink-tiny-linux-riscv64-stripped blink-linux-riscv64" \
            "blink-tiny-linux-loongarch64-stripped blink-linux-loongarch64" \
            "blink-tiny-linux-s390x-stripped blink-linux-s390x"
          do
            set -- $item
            wget "https://github.com/bjia56/blinkverse/releases/download/v8/$1" -O "$2"
            chmod +x "$2"
            if [[ "$2" == "blink-linux-powerpc64le" || "$2" == "blink-linux-i386" ]]; then
              upx --best "$2"
            fi
          done

      - name: Chimplink
        run: |
          wget https://github.com/bjia56/chimp/releases/download/v0.12.0/chimplink
          chmod +x chimplink

          wget https://cosmo.zip/pub/cosmos/bin/ape-aarch64.elf
          wget https://cosmo.zip/pub/cosmos/bin/ape-x86_64.elf

          sha256=$(sha256sum udockerd.exe | cut -d ' ' -f 1)
          ./chimplink udockerd.exe udockerd-unknown-unknown ${{ github.sha }} \
            --sha256 $sha256 \
            ape-x86_64.elf \
            ape-aarch64.elf \
            --os Linux /tmp/blink/blink-linux-*
          chmod +x udockerd-unknown-unknown

      - name: Verify binary
        run: |
          ./udockerd-unknown-unknown --help

      - name: Smoke test container lifecycle (native x86_64)
        run: |
          # Exercises the bundled exe itself (cosmo runtime, not CPython).
          # Native x86_64 only — blink-emulated arches add no extra signal.
          ./udockerd-unknown-unknown --host 127.0.0.1 --port 2375 &
          UDOCKERD_PID=$!
          trap 'kill "$UDOCKERD_PID" 2>/dev/null || true' EXIT

          deadline=$((SECONDS + 60))
          until curl -sf -o /dev/null http://127.0.0.1:2375/_ping; do
            if ! kill -0 "$UDOCKERD_PID" 2>/dev/null; then
              echo "udockerd exited early"
              exit 1
            fi
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "udockerd did not become ready in time"
              exit 1
            fi
            sleep 1
          done

          export DOCKER_HOST=tcp://127.0.0.1:2375
          docker pull alpine:latest
          output=$(docker run --rm alpine:latest echo hello-from-udockerd)
          echo "$output"
          [ "$output" = "hello-from-udockerd" ]

      - name: Upload build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: udockerd-unknown-unknown
          path: udockerd-unknown-unknown
